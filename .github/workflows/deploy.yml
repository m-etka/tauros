name: Cloudflare Pages'e yayınla

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: mandi-oyun
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'ları eklenmemiş; yayın atlandı."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20

      # Her yayında önbellek sürümü değişsin ki tablet yeni sürümü alsın
      - name: Önbellek sürümünü güncelle
        if: env.SKIP != '1'
        run: sed -i "s/mandi-v1/mandi-${GITHUB_SHA::8}/" public/sw.js

      - name: Pages projesini oluştur (yoksa)
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch master || true

      - name: Yayınla
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages deploy public --project-name "$PROJECT" --branch master --commit-dirty=true
