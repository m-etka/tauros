name: Cloudflare Pages'e yayınla

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: mandi-oyun
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'ları eklenmemiş; yayın atlandı."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20

      # Her yayında önbellek sürümü değişsin ki tablet yeni sürümü alsın
      - name: Önbellek ve sürüm etiketini güncelle
        if: env.SKIP != '1'
        run: |
          sed -i "s/mandi-v1/mandi-${GITHUB_SHA::8}/" public/sw.js
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/app.js public/offline.appcache
          # İnternetsiz kullanım için indirilen dosyaların toplam boyutu (sürüm satırında gösterilir)
          SIZE=$(cat public/index.html public/style.css public/app.js public/bus.js public/manifest.json public/icons/icon-192.png public/icons/icon-512.png | wc -c)
          KB=$(( (SIZE + 1023) / 1024 ))
          sed -i "s/__SIZE__/$KB/" public/app.js
          echo "::notice::Internetsiz paket boyutu: $KB KB"

      - name: Pages projesini oluştur (yoksa)
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch master || true

      - name: Yayınla
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages deploy public --project-name "$PROJECT" --branch master --commit-dirty=true

      # mandi.etka.org: Pages projesine alan adı ekle + DNS CNAME kaydı oluştur.
      # Tekrar çalıştırmak güvenlidir; var olan başka bir DNS kaydına dokunmaz.
      - name: Özel alan adı (mandi.etka.org)
        if: env.SKIP != '1'
        env:
          DOMAIN: mandi.etka.org
          ZONE: etka.org
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          SUB=$(curl -s -H "$AUTH" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" | jq -r '.result.subdomain')
          echo "Pages adresi: $SUB"
          [ -n "$SUB" ] && [ "$SUB" != "null" ] || { echo "::error::Pages projesi okunamadı"; exit 1; }

          # 1) Pages projesine alan adını ekle (zaten ekliyse hata vermez)
          if curl -s -H "$AUTH" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" | jq -e --arg d "$DOMAIN" '.result[]? | select(.name==$d)' >/dev/null; then
            echo "Alan adı projede zaten var."
          else
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              --data "{\"name\":\"$DOMAIN\"}" | jq -c '{success, errors}'
          fi

          # 2) DNS kaydı
          ZID=$(curl -s -H "$AUTH" "$API/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          [ -n "$ZID" ] || { echo "::warning::$ZONE bölgesi okunamadı (token'da Zone Read/DNS Edit izni bu bölge için var mı?). DNS kaydını elle ekleyin: CNAME mandi -> $SUB"; exit 0; }
          REC=$(curl -s -H "$AUTH" "$API/zones/$ZID/dns_records?name=$DOMAIN" | jq -c '.result[0] // empty')
          if [ -z "$REC" ]; then
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/zones/$ZID/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$SUB\",\"proxied\":true,\"comment\":\"Mandi oyun (m-etka/tauros)\"}" \
              | jq -c '{success, errors}'
          elif [ "$(echo "$REC" | jq -r '.type + " " + .content')" = "CNAME $SUB" ]; then
            echo "DNS kaydı zaten doğru."
          else
            echo "::warning::$DOMAIN için başka bir DNS kaydı var ($(echo "$REC" | jq -r '.type + " " + .content')). Dokunulmadı."
          fi

      # Cloudflare Web Analytics (çerezsiz, anonim ziyaret sayacı). Token'da yetki yoksa yalnızca uyarır.
      - name: Web Analytics (mandi.etka.org)
        if: env.SKIP != '1'
        run: |
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          LIST=$(curl -s -H "$AUTH" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info/list?per_page=100")
          if [ "$(echo "$LIST" | jq -r '.success')" != "true" ]; then
            echo "::warning::Web Analytics API'ye erişilemedi (token'da 'Account > Web Analytics' izni yok olabilir): $(echo "$LIST" | jq -c '.errors')"
            exit 0
          fi
          if echo "$LIST" | jq -e '.result[]? | select(.ruleset.zone_name? == "etka.org" or .host == "mandi.etka.org") | select(.host == "mandi.etka.org")' >/dev/null; then
            echo "::notice::Web Analytics zaten açık: $(echo "$LIST" | jq -c '[.result[] | select(.host=="mandi.etka.org") | {host, auto_install}]')"
          else
            RES=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info" --data '{"host":"mandi.etka.org","auto_install":true}')
            echo "::notice::Web Analytics kurulumu: $(echo "$RES" | jq -c '{success, errors, host: .result.host, auto_install: .result.auto_install}')"
          fi

      # Yayından sonra canlı adresleri kontrol et (sorun varsa adım kırmızı olur)
      - name: Canlı kontrol
        if: env.SKIP != '1'
        run: |
          # Yeni sürümün kenar sunuculara yayılmasını bekle (en fazla ~2 dk)
          for i in $(seq 1 12); do
            if curl -s "https://mandi.etka.org/app.js?t=$i" | grep -q "var BUILD = .${GITHUB_SHA::7}." && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://mandi.etka.org/bus.js?t=$i")" = 200 ]; then echo "Yeni sürüm yayında ($i. deneme)"; sleep 15; break; fi
            sleep 10
          done
          fail=0
          for HOST in mandi-oyun.pages.dev mandi.etka.org; do
            B="https://$HOST"
            # Asıl adres hata verir; pages.dev yedek adresi geç güncellenebildiği için yalnızca uyarır
            chk() { if eval "$2"; then echo "OK   $HOST $1"; elif [ "$HOST" = mandi.etka.org ]; then echo "::error::$HOST $1 hatalı"; fail=1; else echo "::warning::$HOST $1 henüz güncel değil"; fi; }
            chk "/"          '[ "$(curl -s -o /dev/null -w %{http_code} $B/)" = 200 ]'
            chk "/llms.txt"  'curl -s $B/llms.txt | head -1 | grep -q "^# Mandi"'
            chk "/robots.txt" 'curl -s $B/robots.txt | grep -q "^Sitemap:"'
            chk "/sitemap.xml" 'curl -s $B/sitemap.xml | grep -q "<urlset"'
            chk "/og.jpg"    'curl -sI $B/og.jpg | grep -qi "content-type: image/jpeg"'
            chk "404"        '[ "$(curl -s -o /dev/null -w %{http_code} $B/yok)" = 404 ]'
            chk "/offline.appcache" 'curl -sI $B/offline.appcache | grep -qi "content-type: text/cache-manifest"'
            chk "appcache build" 'curl -s $B/offline.appcache | grep -q "build ${GITHUB_SHA::7}"'
            chk "sürüm etiketi" 'curl -s $B/app.js | grep -q "var BUILD = .${GITHUB_SHA::7}."'
            chk "boyut etiketi" 'curl -s $B/app.js | grep -q "var SIZE_KB = .[0-9]"'
          done
          # Eski cihazlar (iPad 3 / iOS 9) için: Cloudflare sayfayı değiştiriyor mu, dosyalar yönlendiriliyor mu, sertifika zinciri ne?
          # Web Analytics sayaç betiği Cloudflare tarafından eklenir; karşılaştırmada yok sayılır
          curl -s https://mandi.etka.org/ | sed -E 's#<script[^>]*cloudflareinsights[^<]*</script>##g' > /tmp/live.html
          if cmp -s /tmp/live.html public/index.html || diff -q <(tr -d '\n' < /tmp/live.html) <(tr -d '\n' < public/index.html) >/dev/null; then echo "::notice::Canlı index.html depodakiyle aynı (sayaç hariç)"; elif false; then echo "::notice::Canlı index.html depodakiyle aynı"; else echo "::warning::Canlı index.html farklı (Cloudflare bir şey ekliyor olabilir): $(diff public/index.html /tmp/live.html | grep '^>' | head -5 | cut -c1-160 | tr '\n' ' ')"; fi
          CODES=""; for f in / style.css app.js bus.js manifest.json icons/icon-192.png offline.appcache; do CODES="$CODES $f=$(curl -s -o /dev/null -w '%{http_code}' https://mandi.etka.org/${f#/})"; done
          echo "::notice::AppCache dosyaları:$CODES"
          CHAIN=$(echo | openssl s_client -connect mandi.etka.org:443 -servername mandi.etka.org -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:' | sed 's/^ *//' | tr '\n' ' ')
          echo "::notice::Sertifika zinciri: $CHAIN"
          HDR=$(curl -sI https://mandi.etka.org/offline.appcache | grep -i -E '^(content-type|cache-control):' | tr -d '\r' | tr '\n' ' ')
          echo "::notice::appcache başlıkları: $HDR"
          # Cloudflare'in "AI botlarını engelle" / yönetilen robots.txt ayarı açıksa burada görünür
          BLOCK=$(curl -s https://mandi.etka.org/robots.txt | grep -i -E "^disallow: */ *$|content-signal" | sort -u | tr '\n' ' ')
          if [ -n "$BLOCK" ]; then echo "::warning::mandi.etka.org robots.txt engelleme satırları içeriyor: $BLOCK"; else echo "::notice::mandi.etka.org robots.txt temiz"; fi
          exit $fail
